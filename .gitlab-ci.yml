# This file is a template, and might need editing before it works on your project.
# This is a sample GitLab CI/CD configuration file that should run without any modifications.
# It demonstrates a basic 3 stage CI/CD pipeline. Instead of real tests or scripts,
# it uses echo commands to simulate the pipeline execution.
#
# A pipeline is composed of independent jobs that run scripts, grouped into stages.
# Stages run in sequential order, but jobs within stages run in parallel.
#
# For more information, see: https://docs.gitlab.com/ee/ci/yaml/index.html#stages
#
# You can copy and paste this template into a new `.gitlab-ci.yml` file.
# You should not add this template to an existing `.gitlab-ci.yml` file by using the `include:` keyword.
#
# To contribute improvements to CI/CD templates, please follow the Development guide at:
# https://docs.gitlab.com/ee/development/cicd/templates.html
# This specific template is located at:
# https://gitlab.com/gitlab-org/gitlab/-/blob/master/lib/gitlab/ci/templates/Getting-Started.gitlab-ci.yml

stages:          # List of stages for jobs, and stages:
  - build
  - test

.build-job:       # This job runs in the build stage, which runs first.
  stage: build
  image: $IMAGE
  tags:
    - itup-alm-x86
  script:
    - echo "Compiling the code..."
    - mvn -U -B -fae -DskipTests -Dfindbugs clean install
    - echo "Compile complete."
  variables:
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"

build-job-jdk11:
  extends: .build-job
  variables:
    IMAGE: registry.access.redhat.com/ubi8/openjdk-11@sha256:28b35eea470174a39befd8eb9250a3276b79a4f6e7dac7872d09722fc8fe9cd7

.unit-test-job-base: #Base stuff so we dont have to repeat...
  stage: test    # It only starts when the job in the build stage completes successfully.
  image: $IMAGE
  timeout: 2h
  tags:
    - itup-alm-x86
  script: |
    echo "Running unit tests..."
    mvn -U -B -fn install -Pproxy '-DfailIfNoTests=false' $TEST_EXTRA_SWITCH | tee test.log
    echo "Tests finished running"
    ! grep "There are test failures" test.log
    if [ $? -eq 1 ]
        then
            exit 1
    fi
    ! grep "BUILD FAILURE" test.log
    if [ $? -eq 1 ]
        then
            exit 1
    fi
    ! grep "Build failures were ignored." test.log
    exit $?

    #This ^ is required to detect build failre. -fae skip modules that depend on failing module, -fn does not fail at all.
    #We want full build to report all failures, caveat is that enignieer will have to maual go through log to pinpoint those
    #Given above we need to manually detect failure. If by any chance job should fail, this needs a tweak.
    #IMPORTANT: this has to be multilne, seems like gitlab reactor treats each single line as separate bash run
  artifacts:
    reports:
      junit:
        - '**/target/surefire-*/TEST-*.xml'
        # txt excludedd for now as it breaks gitlab test result report
        #- '**/target/surefire-*/*.txt'
  variables:
    IMAGE: ""
    TEST_EXTRA_SWITCH: ""
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "4Gi"

.unit-test-job:
  extends: .unit-test-job-base
  variables:
    TEST_EXTRA_SWITCH: ""
    IMAGE: ""

.unit-test-ipv6-job:
  extends: .unit-test-job-base
  variables:
    TEST_EXTRA_SWITCH: "-Dtest.ipv6=true"
    IMAGE: ""

unit-test-job-jdk11:
  extends: .unit-test-job
  variables:
    IMAGE: registry.access.redhat.com/ubi8/openjdk-11@sha256:28b35eea470174a39befd8eb9250a3276b79a4f6e7dac7872d09722fc8fe9cd7


unit-test-ipv6-job-jdk11:
  extends: .unit-test-ipv6-job
  variables:
    IMAGE: registry.access.redhat.com/ubi8/openjdk-11@sha256:28b35eea470174a39befd8eb9250a3276b79a4f6e7dac7872d09722fc8fe9cd7
